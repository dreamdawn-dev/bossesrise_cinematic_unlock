modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Client-side tweaks for Bosses'Rise cutscenes: free camera, no black screen/bars, no hidden UI, no Resistance/Slowness potion effects, plus a fix for the boss music that keeps playing through the dragon death cinematic.'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="block_factorys_bosses"
mandatory=true
versionRange="[2.1.2,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"