modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Bosses''Rise 过场动画的客户端调整：自由镜头、无黑屏/黑边、无隐藏UI、无抗性/缓慢药水效果，并修复龙死亡过场动画期间 Boss 音乐持续播放的问题。'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="block_factorys_bosses"
mandatory=true
versionRange="[2.1.2,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"